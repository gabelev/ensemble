[project]
name = "ensemble"
version = "0.0.1"
description = "A domain-agnostic framework for creative multi-agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Gabe Lev" }]
# The core is intentionally dependency-free. Integrations (model providers,
# vector stores, orchestrators) enter as optional extras / instance-side deps.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ensemble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
